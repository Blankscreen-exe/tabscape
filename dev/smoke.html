<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smoke test</title>
<style>
  body { font: 14px/1.5 Consolas, monospace; background: #111; color: #ddd; padding: 20px; }
  .pass { color: #5f5; } .fail { color: #f66; }
  iframe { width: 1280px; height: 860px; border: 1px solid #333; margin-top: 16px; }
</style>
</head>
<body>
<h1>Browser smoke test</h1>
<p>Drives the real app in an iframe (preview mode, nothing saved). Run headless with <code>npm run smoke</code>.</p>
<ol id="out"></ol>
<p id="summary">running…</p>
<iframe id="app"></iframe>
<script type="module">
  const out = document.getElementById("out");
  const frame = document.getElementById("app");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let passed = 0, failed = 0;

  const load = theme => new Promise(resolve => {
    frame.onload = async () => {
      for (let i = 0; i < 100 && !frame.contentDocument.documentElement.classList.contains("ready"); i++) await sleep(50);
      await sleep(200);
      frame.contentWindow.confirm = () => true; // auto-accept "reset layout?"
      resolve();
    };
    frame.src = `../newtab.html?preview&theme=${theme}`;
  });
  const $ = sel => frame.contentDocument.querySelector(sel);
  const $$ = sel => [...frame.contentDocument.querySelectorAll(sel)];
  const until = async (fn, ms = 2000) => { for (let t = 0; t < ms; t += 50) { if (fn()) return true; await sleep(50); } return false; };

  async function step(name, fn) {
    try { await fn(); passed++; out.insertAdjacentHTML("beforeend", `<li class="pass">PASS ${name}</li>`); }
    catch (e) { failed++; out.insertAdjacentHTML("beforeend", `<li class="fail">FAIL ${name} — ${String(e.message).replace(/</g, "&lt;")}</li>`); }
  }
  const assert = (cond, msg) => { if (!cond) throw new Error(msg); };

  async function addTodo(text) {
    const input = $(".w-todo .todo-input");
    input.value = text;
    input.form.requestSubmit();
    await sleep(100);
  }

  await load("default");

  await step("default theme boots with 5 widgets, no widget errors", () => {
    assert($$(".g-item").length === 5, `expected 5 frames, got ${$$(".g-item").length}`);
    assert(!$(".w-error") && !$(".boot-error"), "error card present");
    assert(frame.contentDocument.documentElement.dataset.theme === "default", "data-theme not set");
  });

  await step("to-do: add and complete an item, events fire", async () => {
    const { bus, events } = frame.contentWindow.__homepage;
    let completed = 0;
    bus.on(events.TODO_COMPLETED, () => completed++);
    await addTodo("smoke item");
    assert($$(".w-todo li").length === 1, "item not rendered");
    $(".w-todo li .todo-text").click();
    await sleep(100);
    assert($(".w-todo li").classList.contains("done"), "item not marked done");
    assert(completed === 1, "TODO_COMPLETED not emitted");
  });

  await step("theme picker switches to Midnight and keeps shared data", async () => {
    $(".ui-fab").click();
    await until(() => $$(".ui-theme").length >= 2);
    $$(".ui-theme").find(b => b.textContent.includes("Midnight")).click();
    assert(await until(() => frame.contentDocument.documentElement.dataset.theme === "midnight"), "theme did not switch");
    await sleep(300);
    assert($$(".w-todo li").length === 1, "to-do item lost on theme switch");
    assert($(".midnight-stars"), "midnight decoration not mounted");
    assert($('.w-links[data-variant="list"]'), "links variant not applied");
  });

  await step("theme service reacts to widget events (Midnight counts stars)", async () => {
    await addTodo("second");
    $$(".w-todo li .todo-text")[1].click();
    await sleep(100);
    const { store } = frame.contentWindow.__homepage;
    assert(store.snapshot().themeState.midnight?.starsLaunched === 1, `starsLaunched = ${store.snapshot().themeState.midnight?.starsLaunched}`);
  });

  await step("switching back unmounts the old theme's decorations", async () => {
    $$(".ui-theme").find(b => b.textContent.includes("Default")).click();
    assert(await until(() => frame.contentDocument.documentElement.dataset.theme === "default"), "theme did not switch back");
    assert(!$(".midnight-stars"), "midnight decoration leaked");
  });

  await step("edit mode: remove a widget, then reset layout restores it", async () => {
    $$(".ui-btn").find(b => b.textContent === "Edit layout").click();
    await sleep(100);
    assert($("#grid").classList.contains("g-editing"), "edit mode not on");
    assert(!/(false|undefined|null)/.test($(".ui-panel").textContent), "stray false/undefined/null text in the panel");
    const notes = $$(".g-item").find(f => f.querySelector(".w-notes"));
    [...notes.querySelectorAll(".g-btn")].find(b => b.title === "Remove").click();
    await sleep(150);
    assert($$(".g-item").length === 4, `expected 4 frames, got ${$$(".g-item").length}`);
    $$(".ui-btn").find(b => b.textContent.startsWith("Reset")).click();
    await sleep(300);
    assert($$(".g-item").length === 5, "reset did not restore");
  });

  await step("drag moves a widget to a free cell", async () => {
    const frameEl = $$(".g-item").find(f => f.querySelector(".w-todo"));
    const before = frameEl.style.gridRow;
    const bar = frameEl.querySelector(".g-bar");
    const r = bar.getBoundingClientRect();
    const win = frame.contentWindow;
    const ev = (type, x, y, target) => target.dispatchEvent(new win.PointerEvent(type, { clientX: x, clientY: y, button: 0, bubbles: true, pointerId: 1 }));
    ev("pointerdown", r.left + 20, r.top + 5, bar);
    ev("pointermove", r.left + 20, r.top + 5 + 5 * 96, win);   // ~5 rows down (80px row + 16px gap)
    ev("pointerup", r.left + 20, r.top + 5 + 5 * 96, win);
    await sleep(200);
    const moved = $$(".g-item").find(f => f.querySelector(".w-todo"));
    assert(moved.style.gridRow !== before, `gridRow unchanged (${before})`);
  });

  await step("add widget from the picker", async () => {
    const n = $$(".g-item").length;
    $$(".ui-chip").find(b => b.textContent.startsWith("Clock")).click();
    assert(await until(() => $$(".g-item").length === n + 1), "widget not added");
  });

  await step("settings dialog changes a widget (clock shows seconds)", async () => {
    const clockFrame = $$(".g-item").find(f => f.querySelector(".w-clock"));
    const id = clockFrame.dataset.id;
    const indexBefore = $$(".g-item").indexOf(clockFrame);
    [...clockFrame.querySelectorAll(".g-btn")].find(b => b.title === "Settings").click();
    assert(await until(() => $("dialog.ui-dialog")), "dialog did not open");
    $("#set-seconds").checked = true;
    [...$$("dialog.ui-dialog button")].find(b => b.value === "save").click();
    assert(await until(() => /\d\d:\d\d:\d\d/.test($(`.g-item[data-id="${id}"] .clock-time`)?.textContent ?? "")), `seconds not shown: text='${$(`.g-item[data-id="${id}"] .clock-time`)?.textContent}' saved=${JSON.stringify(frame.contentWindow.__homepage.store.snapshot().layouts.default?.find(i => i.id === id)?.settings)} dialogs=${$$("dialog").length}`);
    assert($$(".g-item").findIndex(f => f.dataset.id === id) === indexBefore, "frame moved in DOM order after settings change");
  });

  await step("locked slot (Midnight clock) has no remove button", async () => {
    $$(".ui-theme").find(b => b.textContent.includes("Midnight")).click();
    assert(await until(() => frame.contentDocument.documentElement.dataset.theme === "midnight"), "no switch");
    await sleep(300);
    const locked = $(".g-item.g-locked");
    assert(locked, "no locked frame");
    assert(![...locked.querySelectorAll(".g-btn")].some(b => b.title === "Remove"), "locked item is removable");
  });

  await step("per-theme layouts: Default keeps its edited layout", async () => {
    const { store } = frame.contentWindow.__homepage;
    assert(store.snapshot().layouts.default?.length === 6, `default layout has ${store.snapshot().layouts.default?.length} items`);
    assert(!store.snapshot().layouts.midnight, "midnight layout should still be the theme default");
  });

  // ---------------------------------------------------------------- accent colour
  const rootToken = name => frame.contentWindow.getComputedStyle(frame.contentDocument.documentElement).getPropertyValue(name).trim();
  const switchTo = async name => {
    $$(".ui-theme").find(b => b.textContent.includes(name)).click();
    assert(await until(() => frame.contentDocument.documentElement.dataset.theme === name.toLowerCase()), `no switch to ${name}`);
    await until(() => $(".ui-acc-input"));
    await sleep(150);
  };
  let accentEvents = 0;

  await step("accent: custom colour applies to the current theme only, with readable text colour", async () => {
    const { bus, events, store } = frame.contentWindow.__homepage;
    bus.on(events.ACCENT_CHANGED, () => accentEvents++);
    const input = $(".ui-acc-input");
    input.value = "#ff0000";
    input.dispatchEvent(new frame.contentWindow.Event("input", { bubbles: true }));
    await sleep(100);
    assert(rootToken("--accent") === "#ff0000", `--accent is ${rootToken("--accent")}`);
    assert(["#111111", "#ffffff"].includes(rootToken("--accent-contrast")), "accent-contrast not recomputed");
    assert(store.snapshot().settings.accent.themes.midnight === "#ff0000", "not saved per theme");
    assert(accentEvents >= 1, "ACCENT_CHANGED not emitted");
    await switchTo("Default");
    assert(rootToken("--accent") === "#3b6cf6", `Default should keep its own accent, got ${rootToken("--accent")}`);
  });

  await step("accent: 'use for all themes' applies one colour everywhere", async () => {
    const box = $(".ui-check input");
    box.click();
    await sleep(100);
    $$(".ui-acc-swatch").find(s => s.dataset.color === "#16a34a").click();
    await sleep(100);
    assert(rootToken("--accent") === "#16a34a", `Default accent ${rootToken("--accent")}`);
    await switchTo("Midnight");
    assert(rootToken("--accent") === "#16a34a", `Midnight accent ${rootToken("--accent")}`);
    assert($(".ui-check input").checked, "checkbox not reflecting global mode");
  });

  await step("accent: reset leaves global mode and restores per-theme picks", async () => {
    $$(".ui-btn").find(b => b.textContent === "Use theme colour").click();
    await sleep(100);
    assert(rootToken("--accent") === "#ff0000", `Midnight should return to its own pick, got ${rootToken("--accent")}`);
    $$(".ui-btn").find(b => b.textContent === "Use theme colour").click();
    await sleep(100);
    assert(rootToken("--accent") === "#9db4ff", `Midnight should return to its theme colour, got ${rootToken("--accent")}`);
    assert($$(".ui-btn").find(b => b.textContent === "Use theme colour").disabled, "Use theme colour should be disabled with no custom accent");
  });

  await step("accent: low-contrast colours show a warning", async () => {
    await switchTo("Default");
    const input = $(".ui-acc-input");
    input.value = "#f0f0f0";
    input.dispatchEvent(new frame.contentWindow.Event("input", { bubbles: true }));
    await sleep(100);
    assert(!$(".ui-warn").hidden, "no warning for near-background accent");
    input.value = "#3b6cf6";
    input.dispatchEvent(new frame.contentWindow.Event("input", { bubbles: true }));
    await sleep(100);
    assert($(".ui-warn").hidden, "warning shown for a fine accent");
  });

  await step("export produces a valid backup", () => {
    const json = JSON.parse(frame.contentWindow.__homepage.store.exportJSON());
    assert(json.app === "browser-home-pages" && json.data.schemaVersion >= 1, "bad export");
  });

  // ---------------------------------------------------------------- every theme
  const registryFile = await (await fetch("../registry.json")).json();
  for (const { id } of registryFile.themes) {
    await step(`theme "${id}" boots with its default layout and no widget errors`, async () => {
      await load(id);
      assert(frame.contentDocument.documentElement.dataset.theme === id, "fell back to another theme");
      assert($$(".g-item").length > 0, "no widgets");
      const errs = $$(".w-error").map(e => e.textContent.trim());
      assert(!errs.length, errs.join(" | "));
    });
  }

  // ---------------------------------------------------------------- RPG Quest
  const heroData = () => frame.contentWindow.__homepage.store.snapshot().widgetData.hero ?? { xp: 0, gold: 0 };
  const addQuest = async (text, difficulty) => {
    const form = $(".w-todo .todo-form");
    form.querySelector(".todo-input").value = text;
    if (difficulty) form.querySelector(".todo-diff").value = String(difficulty);
    form.requestSubmit();
    await sleep(80);
  };
  const toggleQuest = async text => { $$(".w-todo li").find(li => li.textContent.includes(text)).querySelector(".todo-text").click(); await sleep(80); };

  await step("rpg: quest-log variant, completing awards XP + gold, reopening takes back exactly that", async () => {
    await load("rpg-quest");
    assert($('.w-todo[data-variant="quest-log"] .todo-diff'), "quest-log variant not applied");
    await addQuest("slay the inbox", 50);
    await toggleQuest("slay the inbox");
    assert(heroData().xp === 50 && heroData().gold === 25, `after complete: ${JSON.stringify(heroData())}`);
    assert($(".rpg-pop"), "no +XP popup from the theme");
    await toggleQuest("slay the inbox");
    assert(heroData().xp === 0 && heroData().gold === 0, `after reopen: ${JSON.stringify(heroData())}`);
  });

  await step("rpg: a second hero widget does not award twice", async () => {
    $(".ui-fab").click();
    await until(() => $$(".ui-btn").some(b => b.textContent === "Edit layout"));
    $$(".ui-btn").find(b => b.textContent === "Edit layout").click();
    await until(() => $$(".ui-chip").length);
    $$(".ui-chip").find(b => b.textContent.startsWith("Hero")).click();
    assert(await until(() => $$(".w-hero").length === 2), "second hero not added");
    $$(".ui-btn").find(b => b.textContent === "Stop editing").click();
    await sleep(100);
    await addQuest("brew potion", 25);
    await toggleQuest("brew potion");
    assert(heroData().xp === 25, `xp is ${heroData().xp}, expected 25`);
  });

  await step("rpg: reaching 100 XP levels up and shows the banner", async () => {
    for (const q of ["q1", "q2", "q3"]) { await addQuest(q, 25); await toggleQuest(q); }
    assert(heroData().xp === 100, `xp ${heroData().xp}`);
    assert($$(".w-hero .hero-lvl").every(e => e.textContent === "LV 2"), "level label not updated");
    assert($(".rpg-banner.show"), "level-up banner not shown");
  });

  // ---------------------------------------------------------------- Zen + Anti-Design
  await step("zen: breathing orb starts and stops, intention is saved", async () => {
    await load("zen");
    $(".w-breath .breath-orb").click();
    await sleep(50);
    assert($(".w-breath .breath-word").textContent === "in", "orb did not start");
    $(".w-breath .breath-orb").click();
    assert($(".w-breath .breath-word").textContent === "start", "orb did not stop");
    const ta = $(".w-intention textarea");
    ta.value = "be kind";
    ta.dispatchEvent(new frame.contentWindow.Event("input", { bubbles: true }));
    await sleep(400);
    assert(frame.contentWindow.__homepage.store.snapshot().widgetData.intention?.text === "be kind", "intention not saved");
    assert($(".zen-mountains") && $(".zen-seal"), "zen decorations missing");
  });

  await step("anti-design: ticker present, dice gives a link, tilt removed in edit mode", async () => {
    await load("anti-design");
    assert($(".anti-ticker"), "no ticker");
    $(".w-dice .dice-die").click();
    await sleep(50);
    assert($(".w-dice .dice-out a")?.href.startsWith("http"), "die did not produce a link");
    $(".ui-fab").click();
    await until(() => $$(".ui-btn").some(b => b.textContent === "Edit layout"));
    $$(".ui-btn").find(b => b.textContent === "Edit layout").click();
    await sleep(100);
    assert(frame.contentWindow.getComputedStyle($(".w-todo")).transform === "none", "widget still tilted in edit mode");
  });

  // ---------------------------------------------------------------- batch 2 widgets
  await step("terminal: commands print output and keep history", async () => {
    await load("terminal");
    const cmd = $(".w-terminal .term-cmd");
    cmd.value = "ls";
    cmd.form.requestSubmit();
    await sleep(50);
    assert(/github\.com/.test($(".w-terminal .term-out").textContent), "ls did not list bookmarks");
    cmd.dispatchEvent(new frame.contentWindow.KeyboardEvent("keydown", { key: "ArrowUp", bubbles: true }));
    assert(cmd.value === "ls", "history recall failed");
    cmd.value = "clear";
    cmd.form.requestSubmit();
    await sleep(50);
    assert($(".w-terminal .term-out").textContent.trim() === "", "clear did not clear");
  });

  await step("bento: search has no inline engine buttons, pomodoro start/pause, calendar navigation", async () => {
    await load("bento");
    const { store } = frame.contentWindow.__homepage;
    assert(!$(".w-search button:not(.search-button)"), "unexpected buttons inside the search bar");
    assert(/Google/.test($(".w-search .search-input").title), "engine hint missing");

    $(".w-pomodoro .pomo-start").click();
    await sleep(50);
    assert(store.snapshot().widgetData.pomodoro?.endsAt > Date.now(), "pomodoro did not start");
    assert($(".w-pomodoro .pomo-start").textContent === "Pause", "button not showing Pause");
    $(".w-pomodoro .pomo-start").click();
    await sleep(50);
    assert(store.snapshot().widgetData.pomodoro?.pausedLeft > 0, "pomodoro did not pause");

    const month = $(".w-calendar .cal-month").textContent;
    $('.w-calendar .cal-nav[data-d="1"]').click();
    assert($(".w-calendar .cal-month").textContent !== month, "next month did not change");
    assert(!$(".w-calendar td.today"), "today shown in another month");
    $(".w-calendar .cal-month").click();
    assert($(".w-calendar td.today"), "back to today failed");
  });

  await step("synthwave + paper-ink: countdown, almanac and masthead render", async () => {
    await load("synthwave");
    assert($(".w-countdown .cd-big").textContent.trim().length > 0, "countdown empty");
    assert($(".sw-sun") && $(".sw-floor"), "synthwave decorations missing");
    await load("paper-ink");
    assert($('.w-progress[data-variant="almanac"] dl'), "almanac variant not applied");
    assert(/\d/.test($(".paper-mast .paper-time .t").textContent), "masthead time missing");
  });

  // ---------------------------------------------------------------- batch 3 widgets + hooks
  await step("concrete: cell tags, stopwatch runs and laps", async () => {
    await load("concrete");
    assert($(".g-item[data-cell]")?.dataset.cell === "A1", `first cell is ${$(".g-item")?.dataset.cell}`);
    const { store } = frame.contentWindow.__homepage;
    $(".w-stopwatch .sw-go").click();
    await sleep(120);
    $(".w-stopwatch .sw-lap").click();
    await sleep(30);
    assert(store.snapshot().widgetData.stopwatch?.laps.length === 1, "lap not recorded");
    $(".w-stopwatch .sw-go").click();
    await sleep(30);
    assert(store.snapshot().widgetData.stopwatch.startedAt === null && store.snapshot().widgetData.stopwatch.acc > 0, "stop failed");
  });

  await step("neo-brutal: habit tick is saved for this week", async () => {
    await load("neo-brutal");
    $(".w-habits .hb-cell.today").click();
    await sleep(50);
    assert($(".w-habits .hb-cell.today").classList.contains("on"), "cell not ticked");
    const weeks = frame.contentWindow.__homepage.store.snapshot().widgetData.habits?.weeks ?? {};
    assert(Object.values(weeks).some(w => Object.keys(w).length === 1), "tick not stored");
  });

  await step("retro-os: windows titled, Start opens Customize, minesweeper first click is safe", async () => {
    await load("retro-os");
    assert($(".w-notes")?.dataset.title === "Notes", "data-title missing");
    $(".ros-start").click();
    assert(await until(() => $(".ui-panel") && !$(".ui-panel").hidden), "Start did not open the panel");
    $$(".w-minesweeper .ms-cell")[40].click();
    await sleep(50);
    assert($$(".w-minesweeper .ms-cell.open").length >= 1, "no cells opened");
    assert($(".w-minesweeper .ms-face").textContent !== "😵", "first click hit a mine");
  });

  await step("mission-control: go/no-go summary, moon, worldclock-style data", async () => {
    await load("mission-control");
    const form = $(".w-todo .todo-form");
    form.querySelector(".todo-input").value = "coffee systems";
    form.requestSubmit();
    await sleep(60);
    assert(/HOLD · 1 NO-GO/.test($(".w-todo .todo-summary").textContent), "summary not HOLD");
    $(".w-todo li .todo-text").click();
    await sleep(60);
    assert(/ALL STATIONS GO/.test($(".w-todo .todo-summary").textContent), "summary not GO");
    assert(/Moon|Crescent|Gibbous|Quarter/.test($(".w-moon .moon-name").textContent), "moon name missing");
    assert(/\d\d:\d\d:\d\d/.test($(".w-orbit .ob-met").textContent), "MET missing");
  });

  await step("swiss-grid + raw-html + lofi-rain: worldclock, counter, rain sound UI", async () => {
    await load("swiss-grid");
    assert($$(".w-worldclock .wc-time").every(t => /\d/.test(t.textContent)), "world times missing");
    await load("raw-html");
    assert(Number($(".w-counter .ctr-lcd").textContent) === 1, `counter is ${$(".w-counter .ctr-lcd").textContent}`);
    await load("lofi-rain");
    assert($(".lofi-city") && $(".w-rainsound .rs-play"), "lofi decorations or rain widget missing");
  });

  // ---------------------------------------------------------------- link icons
  await step("links: favicon shown when it loads, letter kept when it fails, unsafe URLs neutralised", async () => {
    await load("default");
    $(".w-links .links-edit").click();
    await until(() => $(".w-links .links-text"));
    $(".w-links .links-text").value = [
      "Has icon | https://example.invalid | /docs/previews/default.png",  // local file → loads
      "Broken icon | https://example.invalid | /no-such-icon.png",        // 404 → letter
      "Sneaky | javascript://%0Aalert(1)",
    ].join("\n");
    $(".w-links .links-save").click();
    const tiles = () => $$(".w-links .links-ico");
    assert(await until(() => tiles()[0]?.classList.contains("has-img"), 4000), "icon did not load");
    await sleep(300);
    assert(!tiles()[1].classList.contains("has-img"), "broken icon replaced the letter");
    assert(tiles()[1].textContent.trim() === "B", "letter fallback missing");
    assert($$(".w-links a")[2].href.startsWith("https://"), `unsafe href: ${$$(".w-links a")[2].href}`);
  });

  await step("links: 'letters only' makes no icon requests", async () => {
    await load("default");
    $(".ui-fab").click();
    await until(() => $$(".ui-btn").some(b => b.textContent === "Edit layout"));
    $$(".ui-btn").find(b => b.textContent === "Edit layout").click();
    const frameEl = $$(".g-item").find(f => f.querySelector(".w-links"));
    [...frameEl.querySelectorAll(".g-btn")].find(b => b.title === "Settings").click();
    assert(await until(() => $("#set-icons")), "settings dialog missing");
    $("#set-icons").value = "letters";
    [...$$("dialog.ui-dialog button")].find(b => b.value === "save").click();
    await sleep(600);
    assert(!$(".w-links .links-img"), "an icon was loaded in letters-only mode");
    assert(!$$(".w-links .links-ico").some(t => t.classList.contains("has-img")), "has-img set in letters-only mode");
  });

  const summary = document.getElementById("summary");
  summary.textContent = `SMOKE RESULT: ${passed} passed, ${failed} failed`;
  summary.className = failed ? "fail" : "pass";
</script>
</body>
</html>
