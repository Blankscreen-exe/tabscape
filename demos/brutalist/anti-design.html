<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTI—DESIGN</title>
<style>
  /* Anti-design brutalism: clashing colors, mixed type, rotation, overlap, deliberate "wrongness". */
  :root {
    --bg: #0000ff;
    --a: #00ff3c;
    --b: #ff00e5;
    --c: #fffb00;
    --ink: #000;
    --paper: #fff;
    --f1: "Times New Roman", serif;
    --f2: "Arial Black", Impact, sans-serif;
    --f3: "Courier New", monospace;
    --f4: "Comic Sans MS", "Segoe Print", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--paper); font-family: var(--f1); min-height: 100vh; overflow-x: hidden; cursor: crosshair; }

  .ticker { background: var(--c); color: var(--ink); font: 900 18px var(--f2); white-space: nowrap; overflow: hidden; border-bottom: 4px solid var(--ink); }
  .ticker div { display: inline-block; padding: 6px 0; animation: scroll 18s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .stage { position: relative; max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }

  .clock {
    grid-column: 1 / 10; font: 900 clamp(90px, 17vw, 240px) var(--f2); line-height: .8; letter-spacing: -.06em;
    color: var(--a); -webkit-text-stroke: 3px var(--ink); text-shadow: 10px 10px 0 var(--b);
    transform: rotate(-3deg); margin-top: 10px; mix-blend-mode: normal;
  }
  .date {
    grid-column: 9 / 13; align-self: start; background: var(--paper); color: var(--ink); font: italic 28px var(--f1);
    padding: 14px 16px; border: 4px solid var(--ink); transform: rotate(6deg); margin-top: 40px; box-shadow: -12px 12px 0 var(--c);
  }
  .date b { display: block; font: 900 46px var(--f2); font-style: normal; color: var(--b); line-height: 1; }

  .search {
    grid-column: 2 / 12; background: var(--b); border: 5px solid var(--ink); padding: 14px; display: flex; gap: 10px;
    transform: rotate(1deg); margin-top: 30px; box-shadow: 14px 14px 0 var(--ink);
  }
  .search input { flex: 1; min-width: 0; font: 700 26px var(--f3); padding: 10px 14px; border: 4px dashed var(--ink); background: var(--c); outline: none; color: var(--ink); }
  .search input::placeholder { color: var(--ink); opacity: .5; }
  .search button { font: 900 22px var(--f4); background: var(--a); border: 4px solid var(--ink); padding: 0 20px; cursor: pointer; transform: rotate(-4deg); }
  .search button:hover { transform: rotate(4deg) scale(1.1); }

  .links { grid-column: 1 / 6; margin-top: 40px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
  .links h3, .todo h3, .dice h3 { width: 100%; font: 400 64px var(--f4); color: var(--c); line-height: .9; margin-bottom: 6px; text-shadow: 3px 3px 0 var(--ink); }
  .links a {
    font-size: 22px; padding: 8px 14px; color: var(--ink); text-decoration: underline wavy; border: 3px solid var(--ink);
    transition: transform .1s;
  }
  .links a:nth-child(5n+2) { background: var(--a); font-family: var(--f2); transform: rotate(-5deg); }
  .links a:nth-child(5n+3) { background: var(--paper); font-family: var(--f1); font-style: italic; transform: rotate(3deg); }
  .links a:nth-child(5n+4) { background: var(--c); font-family: var(--f3); }
  .links a:nth-child(5n+5) { background: var(--b); font-family: var(--f4); transform: rotate(-2deg); }
  .links a:nth-child(5n+1) { background: #ff6a00; font-family: var(--f2); transform: rotate(4deg); }
  .links a:hover { transform: scale(1.15) rotate(0); z-index: 2; position: relative; }

  .todo {
    grid-column: 6 / 10; margin-top: 70px; background: var(--paper); color: var(--ink); border: 4px solid var(--ink);
    padding: 16px; transform: rotate(-2deg); position: relative;
  }
  .todo h3 { color: var(--bg); text-shadow: 3px 3px 0 var(--a); font-size: 48px; }
  .todo::before { content: "📌"; position: absolute; top: -22px; left: 46%; font-size: 34px; }
  .todo input { width: 100%; font: 18px var(--f3); border: none; border-bottom: 3px solid var(--ink); padding: 6px 2px; outline: none; background: transparent; margin-bottom: 8px; }
  .todo ul { list-style: none; }
  .todo li { font: 22px var(--f4); padding: 4px 0; cursor: pointer; display: flex; gap: 8px; }
  .todo li:nth-child(even) { font-family: var(--f1); font-style: italic; }
  .todo li.done span { text-decoration: line-through; text-decoration-color: var(--b); text-decoration-thickness: 5px; }
  .todo li button { margin-left: auto; background: var(--ink); color: var(--c); border: none; font: 900 14px var(--f2); padding: 0 6px; cursor: pointer; }

  .dice { grid-column: 10 / 13; margin-top: 30px; text-align: center; }
  .dice h3 { font-size: 40px; }
  .die {
    width: 140px; height: 140px; margin: 10px auto; background: var(--a); border: 5px solid var(--ink); font: 900 80px var(--f2);
    color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: 8px 8px 0 var(--b); transition: transform .4s;
  }
  .die.roll { transform: rotate(720deg) scale(.8); }
  .dice p { font: 16px var(--f3); background: var(--ink); padding: 6px; }
  .dice a { color: var(--c); }

  .float { position: fixed; top: 0; left: 0; pointer-events: none; font-size: 40px; z-index: 0; opacity: .9; }

  @media (max-width: 900px) { .stage > * { grid-column: 1 / -1 !important; transform: none !important; } }
</style>
</head>
<body>
<div class="ticker"><div id="ticker"></div></div>

<main class="stage">
  <div class="clock" id="clock">00:00</div>
  <div class="date" id="date"></div>

  <form class="search" id="search">
    <input id="q" placeholder="TYPE SOMETHING. ANYTHING." autocomplete="off" autofocus>
    <button>go!!</button>
  </form>

  <nav class="links">
    <h3>places</h3>
    <a href="https://github.com">GitHub</a>
    <a href="https://youtube.com">YouTube</a>
    <a href="https://reddit.com">reddit</a>
    <a href="https://mail.google.com">MAIL</a>
    <a href="https://wikipedia.org">Wikipedia</a>
    <a href="https://news.ycombinator.com">HN</a>
    <a href="https://twitch.tv">twitch</a>
  </nav>

  <section class="todo">
    <h3>do stuff</h3>
    <form id="todo-form"><input id="todo-input" placeholder="+ another thing to do…"></form>
    <ul id="todo"></ul>
  </section>

  <section class="dice">
    <h3>feeling lucky?</h3>
    <div class="die" id="die" title="Click to roll">?</div>
    <p id="dice-out">click the die → random site</p>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

  const msg = "★ WELCOME TO YOUR NEW TAB ★ DESIGN IS DEAD ★ LONG LIVE DESIGN ★ RULES ARE SUGGESTIONS ★ DRINK WATER ★ ";
  $("ticker").textContent = msg.repeat(6);

  function tick() {
    const d = new Date(), p = n => String(n).padStart(2, "0");
    $("clock").textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
    $("date").innerHTML = `it is<b>${d.toLocaleDateString(undefined, { weekday: "long" }).toUpperCase()}</b>the ${d.getDate()}${["th","st","nd","rd"][(d.getDate() % 10 > 3 || [11,12,13].includes(d.getDate())) ? 0 : d.getDate() % 10]} of ${d.toLocaleDateString(undefined, { month: "long" })}`;
  }
  tick(); setInterval(tick, 1000);

  $("search").onsubmit = e => { e.preventDefault(); const q = $("q").value.trim(); if (q) location.href = "https://duckduckgo.com/?q=" + encodeURIComponent(q); };

  let todos = store.get("brutal-todos", ["pick a brutalist theme", "touch grass"].map(t => ({ t, d: false })));
  function render() {
    $("todo").innerHTML = "";
    todos.forEach((td, i) => {
      const li = document.createElement("li");
      li.className = td.d ? "done" : "";
      li.innerHTML = `<span></span><button>NO</button>`;
      li.querySelector("span").textContent = (td.d ? "☑ " : "☐ ") + td.t;
      li.onclick = e => { if (e.target.tagName === "BUTTON") todos.splice(i, 1); else td.d = !td.d; store.set("brutal-todos", todos); render(); };
      $("todo").appendChild(li);
    });
  }
  $("todo-form").onsubmit = e => { e.preventDefault(); const v = $("todo-input").value.trim(); if (v) { todos.push({ t: v, d: false }); $("todo-input").value = ""; store.set("brutal-todos", todos); render(); } };
  render();

  // random-site die
  const sites = [["Wikipedia: random article", "https://en.wikipedia.org/wiki/Special:Random"], ["The Useless Web", "https://theuselessweb.com"],
                 ["Radio Garden", "https://radio.garden"], ["Window Swap", "https://www.window-swap.com"], ["Neal.fun", "https://neal.fun"], ["Hacker News", "https://news.ycombinator.com"]];
  $("die").onclick = () => {
    const n = Math.floor(Math.random() * 6);
    const die = $("die");
    die.classList.remove("roll"); void die.offsetWidth; die.classList.add("roll");
    die.textContent = "⚀⚁⚂⚃⚄⚅"[n];
    $("dice-out").innerHTML = `you rolled ${n + 1} → <a href="${sites[n][1]}">${sites[n][0]}</a>`;
  };

  // drifting emoji stickers
  const bits = ["✶", "☻", "✿", "⚡", "◉", "✌"];
  for (let i = 0; i < 6; i++) {
    const s = document.createElement("div");
    s.className = "float"; s.textContent = bits[i];
    s.style.color = ["var(--a)", "var(--b)", "var(--c)"][i % 3];
    document.body.appendChild(s);
    let x = Math.random() * innerWidth, y = Math.random() * innerHeight, vx = (Math.random() - .5) * 1.2, vy = (Math.random() - .5) * 1.2, r = 0;
    (function move() {
      x += vx; y += vy; r += vx;
      if (x < 0 || x > innerWidth - 40) vx *= -1;
      if (y < 0 || y > innerHeight - 40) vy *= -1;
      s.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
      requestAnimationFrame(move);
    })();
  }
</script>
</body>
</html>
