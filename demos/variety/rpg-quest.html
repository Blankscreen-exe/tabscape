<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Log</title>
<style>
  /* Retro RPG HUD: to-dos are quests that grant XP, links are inventory items. */
  :root {
    --bg: #1a1c2c;
    --panel: #29366f;
    --panel-dark: #1d2450;
    --border: #f4f4f4;
    --shadow: #0b0d18;
    --text: #f4f4f4;
    --muted: #94b0c2;
    --gold: #ffcd75;
    --hp: #b13e53;
    --mp: #41a6f6;
    --xp: #a7f070;
    --pix: "Courier New", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: bold 15px var(--pix); color: var(--text); min-height: 100vh; image-rendering: pixelated;
    background-color: var(--bg);
    background-image: linear-gradient(45deg, #222539 25%, transparent 25%, transparent 75%, #222539 75%), linear-gradient(45deg, #222539 25%, transparent 25%, transparent 75%, #222539 75%);
    background-size: 32px 32px; background-position: 0 0, 16px 16px;
  }
  .win {
    background: var(--panel); border: 4px solid var(--border); border-radius: 6px; padding: 14px 16px;
    box-shadow: 0 0 0 4px var(--shadow), 6px 6px 0 4px var(--shadow); position: relative;
  }
  .win h3 { color: var(--gold); font-size: 14px; margin-bottom: 10px; letter-spacing: .1em; }
  .win h3::before { content: "◆ "; }

  .page { max-width: 1140px; margin: 0 auto; padding: 4vh 24px 40px; display: grid; gap: 24px; grid-template-columns: 300px 1fr 300px; }

  /* hero stats */
  .hero .avatar { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .hero .avatar .face { width: 64px; height: 64px; background: var(--panel-dark); border: 3px solid var(--border); display: grid; place-items: center; font-size: 36px; }
  .hero .name { font-size: 18px; }
  .hero .lvl { color: var(--gold); }
  .stat { margin-top: 10px; font-size: 13px; }
  .stat .lbl { display: flex; justify-content: space-between; }
  .bar { height: 16px; background: var(--shadow); border: 2px solid var(--border); margin-top: 3px; position: relative; }
  .bar span { display: block; height: 100%; transition: width .4s steps(8); }
  .bar span::after { content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 3px; background: rgba(255,255,255,.25); }

  .clock { text-align: center; font-size: 42px; color: var(--gold); text-shadow: 3px 3px 0 var(--shadow); margin-top: 6px; }
  .clock small { display: block; font-size: 13px; color: var(--muted); text-shadow: none; }

  /* dialogue */
  .dialog { grid-column: 2; min-height: 130px; }
  .dialog .speaker { position: absolute; top: -16px; left: 14px; background: var(--hp); border: 3px solid var(--border); padding: 2px 10px; font-size: 13px; }
  .dialog p { font-size: 17px; line-height: 1.6; margin-top: 6px; min-height: 3.2em; }
  .dialog .next { position: absolute; right: 14px; bottom: 8px; animation: bob .6s steps(2) infinite; color: var(--gold); }
  @keyframes bob { 50% { transform: translateY(3px); } }

  .spell { display: flex; gap: 10px; margin-top: 14px; }
  .spell input { flex: 1; min-width: 0; font: bold 16px var(--pix); background: var(--panel-dark); border: 3px solid var(--border); color: var(--text); padding: 10px 12px; outline: none; }
  .spell input:focus { border-color: var(--gold); }
  .spell button, .pbtn { font: bold 14px var(--pix); background: var(--hp); color: var(--text); border: 3px solid var(--border); padding: 0 14px; cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); }
  .spell button:active, .pbtn:active { transform: translate(3px, 3px); box-shadow: none; }

  /* quests */
  .quests { grid-column: 2; }
  .quests form { display: flex; gap: 10px; margin-bottom: 12px; }
  .quests input { flex: 1; min-width: 0; font: bold 14px var(--pix); background: var(--panel-dark); border: 3px solid var(--border); color: var(--text); padding: 8px 10px; outline: none; }
  .quests select { font: bold 13px var(--pix); background: var(--panel-dark); color: var(--gold); border: 3px solid var(--border); }
  .quests ul { list-style: none; display: grid; gap: 8px; max-height: 300px; overflow: auto; }
  .quests li { display: flex; align-items: center; gap: 10px; background: var(--panel-dark); border: 2px solid var(--muted); padding: 8px 10px; cursor: pointer; }
  .quests li:hover { border-color: var(--gold); }
  .quests li .cursor { color: var(--gold); visibility: hidden; }
  .quests li:hover .cursor { visibility: visible; }
  .quests li .xp { margin-left: auto; color: var(--xp); font-size: 12px; white-space: nowrap; }
  .quests li .del { background: none; border: none; color: var(--hp); font: bold 16px var(--pix); cursor: pointer; }

  /* inventory */
  .inv .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .inv a { aspect-ratio: 1; background: var(--panel-dark); border: 3px solid var(--muted); display: grid; place-items: center; font-size: 26px; text-decoration: none; position: relative; }
  .inv a:hover { border-color: var(--gold); }
  .inv a::after { content: attr(data-name); position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%); background: var(--shadow); color: var(--text); font-size: 11px; padding: 2px 6px; white-space: nowrap; display: none; z-index: 5; border: 2px solid var(--border); }
  .inv a:hover::after { display: block; }
  .gold { margin-top: 14px; color: var(--gold); display: flex; justify-content: space-between; }

  .log { font-size: 12px; color: var(--muted); max-height: 160px; overflow: auto; line-height: 1.6; }
  .log b { color: var(--xp); }

  .toast { position: fixed; left: 50%; top: 30px; transform: translateX(-50%) scale(0); background: var(--gold); color: var(--shadow); border: 4px solid var(--shadow); padding: 12px 22px; font-size: 22px; transition: transform .2s steps(3); z-index: 99; }
  .toast.show { transform: translateX(-50%) scale(1); }

  @media (max-width: 1000px) { .page { grid-template-columns: 1fr; } .page > * { grid-column: auto !important; grid-row: auto !important; } }
</style>
</head>
<body>
<main class="page">
  <section class="win hero" style="grid-row: span 2">
    <h3>HERO</h3>
    <div class="avatar"><div class="face">🧙</div><div><div class="name">Player 1</div><div class="lvl" id="lvl">LV 1</div></div></div>
    <div class="stat"><div class="lbl"><span>HP · day left</span><span id="hp-t"></span></div><div class="bar"><span id="hp" style="background:var(--hp)"></span></div></div>
    <div class="stat"><div class="lbl"><span>MP · week left</span><span id="mp-t"></span></div><div class="bar"><span id="mp" style="background:var(--mp)"></span></div></div>
    <div class="stat"><div class="lbl"><span>XP</span><span id="xp-t"></span></div><div class="bar"><span id="xp" style="background:var(--xp)"></span></div></div>
    <div class="clock"><span id="clock">00:00</span><small id="date"></small></div>
  </section>

  <section class="win dialog">
    <span class="speaker">ORACLE</span>
    <p id="say"></p>
    <span class="next">▼</span>
    <form class="spell" id="spell">
      <input id="q" placeholder="Cast a search spell…" autocomplete="off" autofocus>
      <button>CAST</button>
    </form>
  </section>

  <section class="win inv" style="grid-row: span 2">
    <h3>INVENTORY</h3>
    <div class="slots" id="slots"></div>
    <div class="gold"><span>GOLD</span><span id="gold">0 G</span></div>
    <h3 style="margin-top:22px">BATTLE LOG</h3>
    <div class="log" id="log"></div>
  </section>

  <section class="win quests">
    <h3>QUEST LOG</h3>
    <form id="q-form">
      <input id="q-input" placeholder="New quest…">
      <select id="q-diff"><option value="10">EASY</option><option value="25" selected>NORMAL</option><option value="50">HARD</option></select>
      <button class="pbtn">ACCEPT</button>
    </form>
    <ul id="quests"></ul>
  </section>
</main>
<div class="toast" id="toast">LEVEL UP!</div>

<script>
  const $ = id => document.getElementById(id);
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

  let state = store.get("rpg-state", {
    xp: 0, gold: 0, log: [],
    quests: [{ t: "Defeat the inbox dragon", xp: 50 }, { t: "Brew coffee potion", xp: 10 }, { t: "Choose a home page theme", xp: 25 }],
  });
  const save = () => store.set("rpg-state", state);
  const need = lv => 100 + (lv - 1) * 50;            // xp per level
  function levelInfo(xp) { let lv = 1; while (xp >= need(lv)) { xp -= need(lv); lv++; } return { lv, cur: xp, max: need(lv) }; }

  function renderStats() {
    const d = new Date();
    const hp = 100 - Math.round((d.getHours() * 60 + d.getMinutes()) / 14.4);
    const mp = 100 - Math.round((((d.getDay() + 6) % 7) * 24 + d.getHours()) / 1.68);
    $("hp").style.width = hp + "%"; $("hp-t").textContent = hp + "/100";
    $("mp").style.width = mp + "%"; $("mp-t").textContent = mp + "/100";
    const L = levelInfo(state.xp);
    $("lvl").textContent = "LV " + L.lv; $("xp").style.width = (L.cur / L.max * 100) + "%"; $("xp-t").textContent = `${L.cur}/${L.max}`;
    $("gold").textContent = state.gold + " G";
    $("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    $("date").textContent = `DAY ${Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5)} OF YEAR ${d.getFullYear()}`;
  }
  renderStats(); setInterval(renderStats, 1000);

  // typewriter dialogue
  const lines = (() => {
    const h = new Date().getHours();
    const greet = h < 5 ? "The night is deep, hero. Even legends must sleep." : h < 12 ? "A new dawn rises, hero! Your quests await." : h < 18 ? "The sun is high. Press on, brave one!" : "Dusk falls. Finish your quests before the moon rises.";
    return [greet, "Type below and press CAST to search the realm.", "Complete quests to earn XP and GOLD."];
  })();
  let li = 0;
  function say(text) {
    let i = 0; $("say").textContent = "";
    const t = setInterval(() => { $("say").textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(t); }, 28);
  }
  say(lines[0]);
  document.querySelector(".dialog").addEventListener("click", e => { if (e.target.closest("form")) return; li = (li + 1) % lines.length; say(lines[li]); });

  $("spell").onsubmit = e => { e.preventDefault(); const q = $("q").value.trim(); if (q) location.href = "https://www.google.com/search?q=" + encodeURIComponent(q); };

  // quests
  function addLog(html) { state.log.unshift(html); state.log = state.log.slice(0, 20); }
  function renderQuests() {
    $("quests").innerHTML = "";
    state.quests.forEach((q, i) => {
      const el = document.createElement("li");
      el.innerHTML = `<span class="cursor">▶</span><span class="t"></span><span class="xp">+${q.xp} XP</span><button class="del" title="Abandon">✕</button>`;
      el.querySelector(".t").textContent = q.t;
      el.onclick = e => {
        if (e.target.closest(".del")) { state.quests.splice(i, 1); addLog(`Abandoned: ${esc(q.t)}`); }
        else {
          const before = levelInfo(state.xp).lv;
          state.xp += q.xp; state.gold += Math.round(q.xp / 2);
          state.quests.splice(i, 1);
          addLog(`<b>Quest complete!</b> ${esc(q.t)} (+${q.xp} XP)`);
          if (levelInfo(state.xp).lv > before) { toast(`LEVEL UP! LV ${levelInfo(state.xp).lv}`); addLog(`<b>Reached LV ${levelInfo(state.xp).lv}!</b>`); }
        }
        save(); renderQuests(); renderStats();
      };
      $("quests").appendChild(el);
    });
    if (!state.quests.length) $("quests").innerHTML = `<li style="cursor:default;color:var(--muted)">No active quests. The realm is at peace.</li>`;
    $("log").innerHTML = state.log.join("<br>") || "Nothing has happened yet.";
  }
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  $("q-form").onsubmit = e => {
    e.preventDefault(); const v = $("q-input").value.trim(); if (!v) return;
    state.quests.push({ t: v, xp: +$("q-diff").value }); $("q-input").value = "";
    addLog(`Accepted: ${esc(v)}`); save(); renderQuests();
  };
  renderQuests();

  function toast(t) { $("toast").textContent = t; $("toast").classList.add("show"); setTimeout(() => $("toast").classList.remove("show"), 1800); }

  // inventory = links
  const items = [["⚔️", "GitHub", "https://github.com"], ["📜", "Wikipedia", "https://wikipedia.org"], ["🔮", "YouTube", "https://youtube.com"], ["✉️", "Mail", "https://mail.google.com"],
                 ["🗺️", "Maps", "https://maps.google.com"], ["🍺", "Reddit", "https://reddit.com"], ["🎵", "Spotify", "https://open.spotify.com"], ["🛡️", "Stack Overflow", "https://stackoverflow.com"]];
  $("slots").innerHTML = items.map(([i, n, u]) => `<a href="${u}" data-name="${n}">${i}</a>`).join("") + `<a style="opacity:.3;pointer-events:none"></a>`.repeat(4);
</script>
</body>
</html>
