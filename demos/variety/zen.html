<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen</title>
<style>
  /* Japanese minimal: rice paper, ink-wash mountains, ensō, lots of empty space. */
  :root {
    --paper: #f3eee4;
    --ink: #1f1d1a;
    --ink-soft: rgba(31, 29, 26, .55);
    --wash: rgba(31, 29, 26, .08);
    --seal: #b8322a;
    --serif: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", Georgia, serif;
    --sans: "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--serif); background: var(--paper); color: var(--ink); min-height: 100vh; overflow-x: hidden; }
  .mountains { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 48vh; z-index: 0; pointer-events: none; }

  .page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 10vh 32px 40px; display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 48px; align-items: start; }

  .vertical { writing-mode: vertical-rl; font-size: 15px; letter-spacing: .4em; color: var(--ink-soft); justify-self: start; display: flex; gap: 18px; }
  .vertical .seal { writing-mode: horizontal-tb; width: 38px; height: 38px; background: var(--seal); color: var(--paper); display: grid; place-items: center; font-size: 15px; border-radius: 4px; letter-spacing: 0; transform: rotate(-4deg); }

  .center { text-align: center; }
  .enso { width: min(300px, 70vw); margin: 0 auto; display: block; }
  .enso path { stroke-dasharray: 900; stroke-dashoffset: 900; animation: brush 2.6s cubic-bezier(.6, .1, .3, 1) forwards; }
  @keyframes brush { to { stroke-dashoffset: 0; } }
  .clock { font-size: clamp(54px, 7vw, 84px); font-weight: 400; letter-spacing: .08em; margin-top: -195px; position: relative; }
  .date { color: var(--ink-soft); letter-spacing: .3em; font-size: 13px; margin-top: 4px; position: relative; }
  .center .spacer { height: 110px; }

  .search { margin-top: 30px; display: flex; justify-content: center; }
  .search input { width: min(380px, 100%); text-align: center; font: 18px var(--serif); background: none; border: none; border-bottom: 1px solid var(--ink-soft); padding: 8px; color: var(--ink); outline: none; letter-spacing: .05em; }
  .search input:focus { border-bottom-color: var(--seal); }
  .search input::placeholder { color: var(--ink-soft); }

  h3 { font: 500 12px var(--sans); letter-spacing: .4em; color: var(--ink-soft); margin-bottom: 16px; }

  .breath { text-align: center; margin-top: 40px; }
  .orb { width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle, rgba(31,29,26,.18), rgba(31,29,26,.02) 70%); border: 1px solid var(--wash); transform: scale(.6); transition: transform 4s ease-in-out; cursor: pointer; display: grid; place-items: center; font: 13px var(--sans); letter-spacing: .2em; color: var(--ink-soft); }
  .orb.big { transform: scale(1.1); }
  .breath p { margin-top: 12px; font-size: 13px; color: var(--ink-soft); letter-spacing: .1em; min-height: 1.2em; }

  .side { display: grid; gap: 40px; }
  .links a { display: block; color: var(--ink); text-decoration: none; padding: 6px 0; font-size: 17px; letter-spacing: .05em; border-bottom: 1px solid var(--wash); transition: padding .3s, color .3s; }
  .links a:hover { padding-left: 10px; color: var(--seal); }
  .intent textarea { width: 100%; resize: none; height: 90px; background: none; border: none; outline: none; font: italic 20px var(--serif); color: var(--ink); line-height: 1.5; }
  .haiku { font-size: 15px; line-height: 2; color: var(--ink-soft); font-style: italic; }

  @media (max-width: 900px) { .page { grid-template-columns: 1fr; } .vertical { writing-mode: horizontal-tb; } }
</style>
</head>
<body>
<svg class="mountains" viewBox="0 0 1440 500" preserveAspectRatio="none" aria-hidden="true">
  <defs><filter id="blur"><feGaussianBlur stdDeviation="6"/></filter></defs>
  <path d="M0 300 L120 220 L260 290 L420 170 L560 260 L720 140 L880 250 L1040 180 L1200 270 L1340 200 L1440 240 L1440 500 L0 500Z" fill="rgba(31,29,26,.06)" filter="url(#blur)"/>
  <path d="M0 360 L180 280 L300 340 L470 250 L640 350 L820 270 L980 340 L1160 260 L1320 330 L1440 300 L1440 500 L0 500Z" fill="rgba(31,29,26,.1)" filter="url(#blur)"/>
  <path d="M0 430 L220 360 L400 420 L600 370 L800 430 L1000 380 L1220 440 L1440 400 L1440 500 L0 500Z" fill="rgba(31,29,26,.16)"/>
  <circle cx="1180" cy="120" r="44" fill="rgba(184,50,42,.75)"/>
</svg>

<main class="page">
  <aside class="vertical">
    <span class="seal">静</span>
    <span id="vdate"></span>
    <span>— breathe, then begin —</span>
  </aside>

  <section class="center">
    <svg class="enso" viewBox="0 0 300 300" aria-hidden="true">
      <path d="M210 62 C150 28 70 48 48 120 C26 192 82 258 154 256 C226 254 270 196 258 128 C250 88 224 66 196 58" fill="none" stroke="var(--ink)" stroke-width="16" stroke-linecap="round" opacity=".88"/>
    </svg>
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date"></div>
    <div class="spacer"></div>
    <form class="search" action="https://duckduckgo.com/" method="get">
      <input name="q" placeholder="seek" autocomplete="off" autofocus>
    </form>
    <div class="breath">
      <div class="orb" id="orb">start</div>
      <p id="breath-txt">click to breathe · 4 in · 4 hold · 6 out</p>
    </div>
  </section>

  <section class="side">
    <div class="links">
      <h3>PATHS</h3>
      <a href="https://mail.google.com">Letters</a>
      <a href="https://calendar.google.com">Days</a>
      <a href="https://github.com">Work</a>
      <a href="https://youtube.com">Watch</a>
      <a href="https://en.wikipedia.org">Learn</a>
    </div>
    <div class="intent">
      <h3>INTENTION</h3>
      <textarea id="intent" placeholder="today, I will…"></textarea>
    </div>
    <div>
      <h3>HAIKU</h3>
      <p class="haiku" id="haiku"></p>
    </div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const kanjiNum = n => { const k = "〇一二三四五六七八九"; return n <= 10 ? (n === 10 ? "十" : k[n]) : n < 20 ? "十" + k[n - 10] : k[Math.floor(n / 10)] + "十" + (n % 10 ? k[n % 10] : ""); };

  function tick() {
    const d = new Date();
    $("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    $("date").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }).toUpperCase();
    $("vdate").textContent = `${kanjiNum(d.getMonth() + 1)}月${kanjiNum(d.getDate())}日`;
  }
  tick(); setInterval(tick, 1000);

  const haiku = [
    "An old silent pond<br>a frog jumps into the pond—<br>splash! Silence again. <br>— Bashō",
    "Over the wintry<br>forest, winds howl in rage<br>with no leaves to blow. <br>— Sōseki",
    "Light of the moon<br>moves west, flowers' shadows<br>creep eastward. <br>— Buson",
    "Everything I touch<br>with tenderness, alas,<br>pricks like a bramble. <br>— Issa",
  ];
  $("haiku").innerHTML = haiku[new Date().getDate() % haiku.length];

  try { $("intent").value = localStorage.getItem("zen-intent") ?? ""; } catch {}
  $("intent").oninput = e => { try { localStorage.setItem("zen-intent", e.target.value); } catch {} };

  // box-ish breathing: 4 in, 4 hold, 6 out
  const orb = $("orb"), txt = $("breath-txt");
  let running = false, timers = [];
  function cycle() {
    orb.style.transitionDuration = "4s"; orb.classList.add("big"); orb.textContent = "in"; txt.textContent = "breathe in…";
    timers.push(setTimeout(() => { orb.textContent = "hold"; txt.textContent = "hold…"; }, 4000));
    timers.push(setTimeout(() => { orb.style.transitionDuration = "6s"; orb.classList.remove("big"); orb.textContent = "out"; txt.textContent = "breathe out…"; }, 8000));
    timers.push(setTimeout(cycle, 14000));
  }
  orb.onclick = () => {
    running = !running;
    if (running) cycle();
    else { timers.forEach(clearTimeout); timers = []; orb.classList.remove("big"); orb.textContent = "start"; txt.textContent = "click to breathe · 4 in · 4 hold · 6 out"; }
  };
</script>
</body>
</html>
